name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Must precede typecheck: Next.js generates the route type definitions
      # (PageProps, LayoutProps) into .next/types during the build.
      # No Supabase credentials are needed — every env read is lazy and every
      # authed route is server-rendered on demand.
      - run: npm run build

      - run: npm run typecheck
